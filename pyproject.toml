[project]
name = "cueclear"
version = "1.1.0"
description = "Autonomous music rights clearance for locked-picture timelines"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn>=0.28.0",
  "pydantic>=2.6.0",
  "google-genai>=1.0.0",
  "google-adk>=2.7.0",
  "parallel-web>=1.3.0",
  "httpx>=0.27.0",
  "openpyxl>=3.1.2",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.1",
]

[tool.vercel]
# Tell Vercel which FastAPI instance to run (not tests/test_api.py)
entrypoint = "backend.main:app"
